- id: job_kaifeng_post_run
  name: "差事·驿路走递"
  objectives:
    - stage: carry_dispatch
      text: "将开封驿马院的加急驿信送往北郊递道递铺亭。"
    - stage: delivered
      text: "回开封驿马院向驿卒小乔复命。"
  reward:
    money: 28
    combat_exp: 35
    potential: 25
    items: []
  events:
    - id: job_kaifeng_post_start
      trigger:
        type: talk
        npc: post_runner
      conditions:
        - type: quest_completed
          quest: first_steps_kaifeng
        - type: quest_not_started
          quest: job_kaifeng_post_run
      actions:
        - type: set_stage
          quest: job_kaifeng_post_run
          stage: carry_dispatch
        - type: message
          speaker: "驿卒小乔"
          text: "正巧缺个脚程快的好手！这封北郊递铺的公文急着换马，劳烦你跑一趟北郊递道的递铺亭，把信筒放进驿格里再回来拿工钱。"

    - id: job_kaifeng_post_deliver
      trigger:
        type: enter_room
        map: north_post_road
        position: [0, 2]
      conditions:
        - type: quest_stage
          quest: job_kaifeng_post_run
          stage: carry_dispatch
      actions:
        - type: set_stage
          quest: job_kaifeng_post_run
          stage: delivered
        - type: message
          speaker: "旁白"
          text: "封蜡完好的驿信落进换马信筒，你核对过竹牌记号，转身折回开封驿马院。"

    - id: job_kaifeng_post_finish
      trigger:
        type: talk
        npc: post_runner
      conditions:
        - type: quest_stage
          quest: job_kaifeng_post_run
          stage: delivered
      actions:
        - type: message
          speaker: "驿卒小乔"
          text: "好脚力！这一趟没误了时辰。工钱你收好，手头宽裕的话待会儿还有下一封北路急件。"
        - type: complete_job
          quest: job_kaifeng_post_run

- id: job_kaifeng_smithy_work
  name: "差事·铁铺淬火"
  objectives:
    - stage: fetch_water
      text: "去西市老井取一桶冷井水，带回东巷铁铺。"
    - stage: water_fetched
      text: "回东巷铁铺向赵铁匠复命。"
  reward:
    money: 24
    combat_exp: 30
    potential: 24
    items: []
  events:
    - id: job_kaifeng_smithy_start
      trigger:
        type: talk
        npc: kaifeng_blacksmith
      conditions:
        - type: quest_completed
          quest: kaifeng_artisan_trouble
        - type: quest_not_started
          quest: job_kaifeng_smithy_work
      actions:
        - type: set_stage
          quest: job_kaifeng_smithy_work
          stage: fetch_water
        - type: message
          speaker: "赵铁匠"
          text: "刚赶出一批刃胚，槽里的水太温了，淬不出好钢口。你若得空，替我提桶西市老井的凉水回来，工钱照算，顺道也练练下盘。"

    - id: job_kaifeng_smithy_fetch
      trigger:
        type: enter_room
        map: kaifeng_city
        position: [-3, 1]
      conditions:
        - type: quest_stage
          quest: job_kaifeng_smithy_work
          stage: fetch_water
      actions:
        - type: set_stage
          quest: job_kaifeng_smithy_work
          stage: water_fetched
        - type: message
          speaker: "旁白"
          text: "你从老井打起一桶透心凉的井水，沉稳提在手里，折回东巷铁铺交差。"

    - id: job_kaifeng_smithy_finish
      trigger:
        type: talk
        npc: kaifeng_blacksmith
      conditions:
        - type: quest_stage
          quest: job_kaifeng_smithy_work
          stage: water_fetched
      actions:
        - type: message
          speaker: "赵铁匠"
          text: "嗤啦一声，这水够凉！腕子稳当了不少，这几文工钱拿去买药或换把趁手家伙吧。"
        - type: complete_job
          quest: job_kaifeng_smithy_work

- id: job_luoyang_peony_patrol
  name: "差事·洛水巡场"
  objectives:
    - stage: scout_weir
      text: "前往洛水旧堰亭查探周边动静。"
    - stage: weir_checked
      text: "再赴白马寺外山门巡看官道来客。"
    - stage: baima_checked
      text: "回洛阳牡丹会场向裴文举复命。"
  reward:
    money: 38
    combat_exp: 55
    potential: 38
    items: []
  events:
    - id: job_luoyang_patrol_start
      trigger:
        type: talk
        npc: peony_host_assistant
      conditions:
        - type: quest_completed
          quest: luoyang_peony_duel
        - type: quest_not_started
          quest: job_luoyang_peony_patrol
      actions:
        - type: set_stage
          quest: job_luoyang_peony_patrol
          stage: scout_weir
        - type: message
          speaker: "裴文举"
          text: "如今你在牡丹台挂了名，正合适替会场走一趟外围巡查。请先去洛水旧堰亭看看有没有寻衅滋事的游侠，再去白马寺外山门望一眼东郊官道，回来记你一份酬劳。"

    - id: job_luoyang_patrol_weir
      trigger:
        type: enter_room
        map: luoyang_city
        position: [2, 5]
      conditions:
        - type: quest_stage
          quest: job_luoyang_peony_patrol
          stage: scout_weir
      actions:
        - type: set_stage
          quest: job_luoyang_peony_patrol
          stage: weir_checked
        - type: message
          speaker: "旁白"
          text: "洛水旧堰亭一带风平浪静，几名过路剑客见你步履沉稳，各自抱拳让开半步。顺道再去白马寺外山门望一眼便是。"

    - id: job_luoyang_patrol_baima
      trigger:
        type: enter_room
        map: luoyang_city
        position: [0, 7]
      conditions:
        - type: quest_stage
          quest: job_luoyang_peony_patrol
          stage: weir_checked
      actions:
        - type: set_stage
          quest: job_luoyang_peony_patrol
          stage: baima_checked
        - type: message
          speaker: "旁白"
          text: "白马寺外山门清静如常，东郊官道上的商旅也秩序井然，这趟巡场算是有个交代了。"

    - id: job_luoyang_patrol_finish
      trigger:
        type: talk
        npc: peony_host_assistant
      conditions:
        - type: quest_stage
          quest: job_luoyang_peony_patrol
          stage: baima_checked
      actions:
        - type: message
          speaker: "裴文举"
          text: "辛苦阁下走这一趟。牡丹会最重规矩与信义，这份酬银请收下，改日得空还请继续搭把手。"
        - type: complete_job
          quest: job_luoyang_peony_patrol

- id: job_dali_caravan_patrol
  name: "差事·苍山探路"
  objectives:
    - stage: scout_stream
      text: "前往苍山冷泉涧探察山道水情。"
    - stage: stream_scouted
      text: "登上苍山废石场高处瞭望商路。"
    - stage: cliff_scouted
      text: "回大理茶马车场向茶马护卫复命。"
  reward:
    money: 40
    combat_exp: 60
    potential: 40
    items: []
  events:
