          stage: scout_stream
        - type: message
          speaker: "茶马护卫"
          text: "下一批茶马马上要过西山，前哨人手紧。兄弟若愿意搭把手，先去苍山冷泉涧看看山涧有没有滑石，再上废石场高处望一眼马道，回来领一笔探路银钱。"

    - id: job_dali_patrol_stream
      trigger:
        type: enter_room
        map: dali_city
        position: [-2, 2]
      conditions:
        - type: quest_stage
          quest: job_dali_caravan_patrol
          stage: scout_stream
      actions:
        - type: set_stage
          quest: job_dali_caravan_patrol
          stage: stream_scouted
        - type: message
          speaker: "旁白"
          text: "冷泉涧石路虽湿，尚可稳步过马。再往北登一趟废石场，便能把前路看个透彻。"

    - id: job_dali_patrol_cliff
      trigger:
        type: enter_room
        map: dali_city
        position: [-2, 3]
      conditions:
        - type: quest_stage
          quest: job_dali_caravan_patrol
          stage: stream_scouted
      actions:
        - type: set_stage
          quest: job_dali_caravan_patrol
          stage: cliff_scouted
        - type: message
          speaker: "旁白"
          text: "立在苍山废石场高处极目远眺，山下马道并无埋伏烟尘，商队今日可照常发车了。"

    - id: job_dali_patrol_finish
      trigger:
        type: talk
        npc: dali_caravan_guard
      conditions:
        - type: quest_stage
          quest: job_dali_caravan_patrol
          stage: cliff_scouted
      actions:
        - type: message
          speaker: "茶马护卫"
          text: "有你这一趟回报，马帮心里就有底了。这是段家账上拨的探路钱，收好！"
        - type: complete_job
          quest: job_dali_caravan_patrol

- id: job_taihu_herb_gathering
  name: "差事·水榭理药"
  objectives:
    - stage: wash_herbs
      text: "到洗药溪淘洗新采的药根。"
    - stage: washed
      text: "把洗净的药草送去晒药架翻晒。"
    - stage: dried
      text: "回水榭外院向药童复命。"
  reward:
    money: 32
    combat_exp: 42
    potential: 35
    items: []
  events:
    - id: job_taihu_herb_start
      trigger:
        type: talk
        npc: taihu_herb_boy
      conditions:
        - type: flag
          flag: taihu.pavilion_guest
        - type: quest_not_started
          quest: job_taihu_herb_gathering
      actions:
        - type: set_stage
          quest: job_taihu_herb_gathering
          stage: wash_herbs
        - type: message
          speaker: "水榭药童"
          text: "前堂的药罐正催着呢，我一个人忙不过来。你帮我把这筐药根拿去洗药溪漂净泥沙，再摊到西边晒药架上，回来我记你一份诊资酬劳。"

    - id: job_taihu_herb_wash
      trigger:
        type: enter_room
        map: taihu_water_pavilion
        position: [1, 2]
      conditions:
        - type: quest_stage
          quest: job_taihu_herb_gathering
          stage: wash_herbs
      actions:
        - type: set_stage
          quest: job_taihu_herb_gathering
          stage: washed
        - type: message
          speaker: "旁白"
          text: "清浅溪水冲净了药根上的泥沙，草木清气扑面而来。趁着日头正好，拿去西侧晒药架摊开吧。"

    - id: job_taihu_herb_dry
      trigger:
        type: enter_room
        map: taihu_water_pavilion
        position: [-1, 2]
      conditions:
        - type: quest_stage
          quest: job_taihu_herb_gathering
          stage: washed
      actions:
        - type: set_stage
          quest: job_taihu_herb_gathering
          stage: dried
        - type: message
          speaker: "旁白"
          text: "药草按性味分格铺上竹架，微风一过，药香四散。外院的药童这会儿该等急了。"

    - id: job_taihu_herb_finish
      trigger:
        type: talk
        npc: taihu_herb_boy
      conditions:
        - type: quest_stage
          quest: job_taihu_herb_gathering
          stage: dried
      actions:
        - type: message
          speaker: "水榭药童"
          text: "分格清清楚楚，一点没弄混！这是水榭给的谢礼，若缺伤药也可以顺便在我这儿抓几包。"
        - type: complete_job
          quest: job_taihu_herb_gathering

- id: job_kaifeng_bounty_raider
  name: "悬赏·清剿截路盐枭"
  objectives:
    - stage: hunt_raider
      text: "出开封北门至北郊递道的藏身小径，击退流窜的北郊截路盐枭。"
    - stage: report_constable
      text: "回开封府捕房向顾捕头或西市公告墙榜前录事复命领赏。"
  reward:
    money: 45
    combat_exp: 65
    potential: 45
    items:
      - id: wound_powder
        amount: 1
  events:
    - id: job_kaifeng_bounty_start
      trigger:
        type: talk
        npc: kaifeng_notice_board_clerk
      conditions:
        - type: quest_completed
          quest: north_road_patrol
        - type: quest_not_started
          quest: job_kaifeng_bounty_raider
      actions:
        - type: set_stage
          quest: job_kaifeng_bounty_raider
          stage: hunt_raider
        - type: show_npc
          npc: bounty_north_raider
        - type: message
          speaker: "榜前录事"
          text: "刚贴出的新悬赏：北郊递道藏身小径又冒出个携毒砂截路的盐枭。捕房赏银四十五文外加一包金创药，客官要揭这张榜吗？揭了便去北郊吧。"

    - id: job_kaifeng_bounty_confront
      trigger:
        type: talk
        npc: bounty_north_raider
      conditions:
        - type: quest_stage
          quest: job_kaifeng_bounty_raider
          stage: hunt_raider
      actions:
        - type: message
          speaker: "北郊截路盐枭"
          text: "又是揭了西市悬赏来换银子的？尝尝我这碧水毒砂！"
        - type: start_battle
          target: bounty_north_raider

    - id: job_kaifeng_bounty_defeat
      trigger:
        type: kill
        npc: bounty_north_raider
      conditions:
        - type: quest_stage
          quest: job_kaifeng_bounty_raider
          stage: hunt_raider
      actions:
        - type: hide_npc
          npc: bounty_north_raider
        - type: set_stage
          quest: job_kaifeng_bounty_raider
          stage: report_constable
        - type: message
          speaker: "旁白"
          text: "截路盐枭被你打翻在地，丢下毒砂袋仓皇钻进松林。你可以回西市公告墙或捕房领赏了。"

    - id: job_kaifeng_bounty_finish_clerk
      trigger:
        type: talk
        npc: kaifeng_notice_board_clerk
      conditions:
        - type: quest_stage
          quest: job_kaifeng_bounty_raider
          stage: report_constable
      actions:
        - type: message
          speaker: "榜前录事"
          text: "北郊递铺刚捎回信说小径清静了！赏银和金创药这就给你销榜结算。"
        - type: complete_job
          quest: job_kaifeng_bounty_raider

    - id: job_kaifeng_bounty_finish_constable
      trigger:
        type: talk
        npc: kaifeng_constable
      conditions:
        - type: quest_stage
          quest: job_kaifeng_bounty_raider
          stage: report_constable
      actions:
        - type: message
          speaker: "顾捕头"
          text: "动作够利落。盐帮那帮人擅长使青毒，拿这包金创药和赏银备着，往后遇上心里有数。"
        - type: complete_job
          quest: job_kaifeng_bounty_raider

- id: job_dali_bounty_bandit
  name: "悬赏·苍山清匪"
  objectives:
    - stage: hunt_bandit
      text: "登上苍山冷泉涧北面的苍山废石场，击退流窜马匪。"
    - stage: report_tracker
      text: "回苍山冷泉涧向猎山人阿罗复命领赏。"
  reward:
    money: 60
    combat_exp: 90
    potential: 60
    items: []
  events:
