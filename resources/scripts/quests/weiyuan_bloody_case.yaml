id: weiyuan_bloody_case
name: "威远镖局旧案"
objectives:
  - stage: intruder
    text: "破庙外有人追来，挡住闯入的黑衣人。"
  - stage: duel
    text: "击退黑衣人，保住老镖师和灰衣少年。"
  - stage: escort_dying
    text: "回头查看老镖师的伤势。"
  - stage: escort_road
    text: "沿汴水官道护送灰衣少年到开封城南的威远分局，把路单交给骆主事。"
  - stage: branch_gate
    text: "陪灰衣少年进威远镖局，看看里面是否还有活口。"
  - stage: inner_court
    text: "灰衣少年冲进了内院。跟过去看看。"
  - stage: completed
    text: "灰衣少年留书出走。你替他收着路单和剑谱，先在开封找个落脚处。"
reward:
  money: 0
  combat_exp: 20
  potential: 10
  items: []
events:
  - id: young_escort_before_warning
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_not_started
        quest: weiyuan_bloody_case
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "别出声……外头刚过去一拨人。陈伯撑不住了，你帮我看看他。"

  - id: old_escort_warns_in_temple
    trigger:
      type: talk
      npc: wounded_escort
    conditions:
      - type: quest_not_started
        quest: weiyuan_bloody_case
    actions:
      - type: message
        speaker: "受伤老镖师"
        text: "快把火折子收起来……追兵顺着车辙摸过来了。这庙里一亮，谁都跑不掉。"
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: intruder
      - type: message
        speaker: "旁白"
        text: "话音未落，门外一阵急促脚步踏碎水洼。半扇破门被人一脚踹开，冷雨和风一起灌进殿里。"
      - type: show_npc
        npc: temple_black_clad
      - type: message
        speaker: "黑衣人"
        text: "果然躲在这儿。屋里不管有几个，今夜一个别留。"
      - type: message
        speaker: "受伤老镖师"
        text: "后生，别让他摸到神龛那边！他左肋挨过我一剑，撑不了几招！"

  - id: old_escort_urges_fight
    trigger:
      type: talk
      npc: wounded_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: intruder
    actions:
      - type: message
        speaker: "受伤老镖师"
        text: "他左肋挨过我一剑，脚下已经虚了，只是硬撑着。别让他靠近神龛那边的孩子！"

  - id: young_escort_urges_fight
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: intruder
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "他剑上还有血……我的腿不听使唤，你小心！"

  - id: black_clad_forces_fight
    trigger:
      type: talk
      npc: temple_black_clad
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: intruder
    actions:
      - type: message
        speaker: "黑衣人"
        text: "路过躲雨的？算你倒霉，既然撞见了，就别想活着出这座庙。"
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: duel
      - type: start_battle
        target: temple_black_clad

  - id: black_clad_defeated
    trigger:
      type: kill
      npc: temple_black_clad
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: duel
    actions:
      - type: hide_npc
        npc: temple_black_clad
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: escort_dying
      - type: message
        speaker: "旁白"
        text: "黑衣人仰面栽在门槛边。老镖师扶着断柱想站起来，脚下一软，又重重滑坐回去。"
      - type: message
        speaker: "旁白"
        text: "黑衣人的袖口翻开，腕上刺着一圈细密墨线，像一道没写完的符。他左肋的剑伤还在往外冒血。"
      - type: set_flag
        flag: weiyuan.saw_ink_mark

  - id: young_escort_after_fight
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_dying
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "陈伯……陈伯的血止不住了，你快来看看！"

  - id: old_escort_last_request
    trigger:
      type: talk
      npc: wounded_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_dying
    actions:
      - type: message
        speaker: "受伤老镖师"
        text: "我不行了……包袱底有三十文钱，还有这趟镖的底单。带这孩子进开封城……去南渡的威远分局，找骆主事……"
      - type: give_money
        amount: 30
      - type: give_item
        item: soaked_route_note
        amount: 1
      - type: delay
        ms: 1800
      - type: message
        speaker: "受伤老镖师"
        text: "要是分局也……也出事了，别回头，带着孩子有多远走多远。"
      - type: message
        speaker: "旁白"
        text: "老镖师说完这句，攥着你袖子的手慢慢松了。少年扑在膝边喊了两声，见人没了声息，咬着牙把自己的斗笠摘下来，轻轻盖在陈伯脸上。"
      - type: message
        speaker: "灰衣少年"
        text: "……走吧。别让陈伯白死在这儿。"
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: escort_road
      - type: hide_npc
        npc: wounded_escort
      - type: transition
        text: "你与少年冒雨离开破庙，踏上汴水官道。"
        ms: 1800
      - type: move_player
        map: bianshui_road
        position: [0, 0]
      - type: message
        speaker: "灰衣少年"
        text: "顺着汴水往北就是南渡，过了州桥便是城门。我爹今夜该在柜上……我们快走，别在半道撞上另一拨人。"

  - id: young_escort_on_road
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_road
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "北面已经能看见州桥和城灯了。威远分局就在南渡东边，我爹今夜该在柜上。"

  - id: reach_kaifeng_with_young_escort
    trigger:
      type: enter_room
      map: kaifeng_city
      position: [0, -3]
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: escort_road
    actions:
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: branch_gate
      - type: message
        speaker: "旁白"
        text: "城里的灯火越过州桥映在汴水上。少年抹去脸上的雨，指向渡口东边一块黑漆门匾。"
      - type: message
        speaker: "灰衣少年"
        text: "那里就是威远分局。可门口的灯笼，怎么一盏都没点？"

  - id: young_escort_at_branch_gate
    trigger:
      type: talk
      npc: grey_young_escort
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: branch_gate
    actions:
      - type: message
        speaker: "灰衣少年"
        text: "门没上闩，里面却没有灯。你若肯，再陪我走到前厅。"

  - id: enter_weiyuan_branch_hall
    trigger:
      type: enter_room
      map: kaifeng_city
      position: [2, -3]
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: branch_gate
    actions:
      - type: message
        speaker: "旁白"
        text: "前厅门扇半开。镖旗被砍断，账册散在血水里，廊柱后倒着几名镖师，已经没了声息。"
      - type: delay
        ms: 1600
      - type: message
        speaker: "灰衣少年"
        text: "早上出镖时，他们还在点账……爹！娘！"
      - type: message
        speaker: "旁白"
        text: "少年把背上的包袱往你怀里一塞，跌跌撞撞冲进了通往内院的月门。"
      - type: give_item
        item: weiyuan_sword_manual
        amount: 1
      - type: hide_npc
        npc: grey_young_escort
      - type: set_stage
        quest: weiyuan_bloody_case
        stage: inner_court

  - id: find_youth_gone_in_inner_court
    trigger:
      type: enter_room
      map: kaifeng_city
      position: [3, -3]
    conditions:
      - type: quest_stage
        quest: weiyuan_bloody_case
        stage: inner_court
    actions:
      - type: message
        speaker: "旁白"
        text: "内院正房的门开着，里面没有活人。少年不在这里，后门半掩，泥地上一串脚印朝河边去了。"
      - type: delay
        ms: 1600
      - type: message
        speaker: "旁白"
        text: "井台青石上留着几道剑尖划出的新痕，笔画歪斜却深，像是临走前匆忙刻下的。"
      - type: message
        speaker: "灰衣少年（井台刻字）"
        text: "路单和剑谱替我收着，留在我身上活不过今夜。别找我，找我的人会顺着你找来。"
      - type: delay
        ms: 1600
      - type: message
        speaker: "旁白"
        text: "南渡那头忽然亮起一串灯笼，有人在喊：“威远分局出事了，快去报官！”脚步声正朝前门来。"
      - type: set_flag
        flag: weiyuan.youth_separated
      - type: set_flag
        flag: weiyuan.route_note_kept
      - type: set_stage
        quest: first_steps_kaifeng
        stage: guide
      - type: complete_quest
        quest: weiyuan_bloody_case
      - type: transition
        text: "你从后门出去，贴着河堤绕到柳岸码头，身后的灯笼越聚越多。"
        ms: 2000
      - type: move_player
        map: kaifeng_city
        position: [-1, -3]
      - type: message
        speaker: "旁白"
        text: "柳树下蹲着个抽旱烟的汉子。他看了你一眼，又看了一眼威远分局的后墙，什么也没说。"
