- id: sect_grad_taihu
  name: "出师·平毒护岸"
  objectives:
    - stage: stop_plague
      text: "赴芦苇暗港击退企图向湖岸水源投毒的投毒暗桩头目。"
    - stage: report_senior
      text: "回水榭药堂向白发医者辞行出师。"
    - stage: completed
      text: "你已护住湖岸体面出师，保留全部水榭真传医武。"
  reward:
    money: 130
    combat_exp: 125
    potential: 95
    items: []
  events:
    - id: taihu_grad_start
      trigger:
        type: talk
        npc: taihu_senior
      conditions:
