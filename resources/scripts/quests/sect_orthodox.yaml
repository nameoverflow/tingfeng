          stage: stop_plague
        - type: show_npc
          npc: taihu_plague_raider
        - type: message
          speaker: "太湖白发医者"
          text: "盐帮死士扬言今夜要在芦苇暗港下毒逼水榭就范。你既已修成听涛剑与碧波诀，替水榭挡下这一劫，便可体面出师游历天下。"

    - id: taihu_grad_fight
