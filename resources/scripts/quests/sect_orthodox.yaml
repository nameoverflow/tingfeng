# 四方名门：少林外门、武当清修、五岳嵩阳、太湖真传
# 包含：机缘入派 -> 二阶升级拜师中阶剧情 -> 三阶体面出师 -> 门派专属日常差事

# ============================================================================
# 1. 少林外门（洛阳白马寺·扫碑老人澄尘）
# ============================================================================

- id: sect_join_shaolin
  name: "机缘·碑阴借伞"
  objectives:
    - stage: stele_stance
      text: "赴白马寺山门茶寮向知客僧明心取旧木棍，再回古碑亭听扫碑老人点拨。"
    - stage: completed
      text: "你已凭机缘拜入少林俗家外门，获赠旧木念珠并习得《罗汉伏魔棍》。"
  reward:
    money: 0
    combat_exp: 60
    potential: 45
    items: []
  events:
    - id: shaolin_join_already_in_sect
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: flag
          flag: luoyang.wensheng_trusted
        - type: flag
          flag: sect.has_active
        - type: not_flag
          flag: sect.active.shaolin
        - type: not_flag
          flag: sect.shaolin_declined_noted
      actions:
        - type: set_flag
          flag: sect.shaolin_declined_noted
        - type: message
          speaker: "扫碑老人"
          text: "老朽看你下盘稳当，原动过收徒的念头。可惜你身上已带着别家师门的印子，各为其主，便不夺人弟子了。"

    - id: shaolin_join_start
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: flag
          flag: luoyang.wensheng_trusted
        - type: art_level_at_least
          art: basic_internal
          level: 10
        - type: not_flag
          flag: sect.has_active
        - type: not_flag
          flag: sect.betrayed.any
        - type: not_flag
          flag: sect.betrayed.shaolin
        - type: not_flag
          flag: sect.graduated.shaolin
        - type: quest_not_started
          quest: sect_join_shaolin
      actions:
        - type: set_stage
          quest: sect_join_shaolin
          stage: stele_stance
        - type: message
          speaker: "扫碑老人"
          text: "你把古碑拓片老实交还闻声，没拿去旧剑市换银子，心性倒是难得。方才看你踏过湿阶，内息也算沉稳。"
        - type: message
          speaker: "扫碑老人"
          text: "去外山门找明心取一根旧木棍，再回碑亭照着碑阴折锋走三步给老朽看看。"

    - id: shaolin_join_monk_hands_staff
      trigger:
        type: talk
        npc: baima_guest_monk
      conditions:
        - type: quest_stage
          quest: sect_join_shaolin
          stage: stele_stance
        - type: not_flag
          flag: sect.shaolin.got_trial_staff
      actions:
        - type: set_flag
          flag: sect.shaolin.got_trial_staff
        - type: message
          speaker: "知客僧明心"
          text: "阿弥陀佛，澄尘师叔居然让你来取木棍！师叔早年在少室山罗汉堂退隐，四十年未收过俗家弟子，施主快回古碑亭吧。"

    - id: shaolin_join_complete
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: quest_stage
          quest: sect_join_shaolin
          stage: stele_stance
        - type: flag
          flag: sect.shaolin.got_trial_staff
      actions:
        - type: set_flag
          flag: sect.active.shaolin
        - type: set_flag
          flag: sect.has_active
        - type: give_item
          item: shaolin_wooden_beads
          amount: 1
        - type: complete_quest
          quest: sect_join_shaolin
        - type: message
          speaker: "扫碑老人"
          text: "好，步子不浮、棍势不躁。老朽法号澄尘，原是少林罗汉堂宿老。你既是俗家身份，不必剃度出家，但须记着佛门不嗜杀、不沾黑道私活的戒律。"
        - type: message
          speaker: "扫碑老人"
          text: "这串旧木念珠你收着，从今日起你便是少林俗家外门弟子。先随我把《罗汉伏魔棍》练到十四级，再来领门内差事晋升罗汉堂内传。"

- id: sect_inner_shaolin
  name: "师门·经卷蒙尘"
  objectives:
    - stage: track_thief
      text: "前往洛水旧堰亭查访偷走白马寺罗汉堂注疏残卷的偷卷游侠。"
    - stage: return_scroll
      text: "将追回的《罗汉堂注疏残卷》交还白马寺古碑亭的扫碑老人澄尘。"
    - stage: completed
      text: "你已追回经卷，获澄尘行入室授珠礼，晋升少林罗汉堂内传俗家弟子并习得《少林金刚护体》。"
  reward:
    money: 50
    combat_exp: 85
    potential: 65
    items: []
  events:
    - id: shaolin_inner_start
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: flag
          flag: sect.active.shaolin
        - type: art_level_at_least
          art: luohan_subduing_staff
          level: 14
        - type: quest_not_started
          quest: sect_inner_shaolin
      actions:
        - type: set_stage
          quest: sect_inner_shaolin
          stage: track_thief
        - type: show_npc
          npc: shaolin_scroll_thief
        - type: message
          speaker: "扫碑老人"
          text: "你的伏魔棍已有根基。昨夜经阁少了一卷罗汉堂护体注疏，明心打听到偷卷游侠躲在洛水旧堰亭。去把残卷请回来，切记留手，莫伤他性命。"

    - id: shaolin_inner_fight
      trigger:
        type: talk
        npc: shaolin_scroll_thief
      conditions:
        - type: quest_stage
          quest: sect_inner_shaolin
          stage: track_thief
      actions:
        - type: message
          speaker: "偷卷游侠"
          text: "白马寺的俗家弟子追到旧堰亭来了？想拿经卷，先赢过我手里的剑！"
        - type: start_battle
          target: shaolin_scroll_thief

    - id: shaolin_inner_defeat
      trigger:
        type: kill
        npc: shaolin_scroll_thief
      conditions:
        - type: quest_stage
          quest: sect_inner_shaolin
          stage: track_thief
      actions:
        - type: hide_npc
          npc: shaolin_scroll_thief
        - type: give_item
          item: shaolin_lost_scroll
          amount: 1
        - type: set_stage
          quest: sect_inner_shaolin
          stage: return_scroll
        - type: message
          speaker: "旁白"
          text: "你收势点开游侠手腕，并未下重手。他羞愧交出怀中的《罗汉堂注疏残卷》，拱手离去。"

    - id: shaolin_inner_complete
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: quest_stage
          quest: sect_inner_shaolin
          stage: return_scroll
        - type: has_item
          item: shaolin_lost_scroll
      actions:
        - type: take_item
          item: shaolin_lost_scroll
          amount: 1
        - type: set_flag
          flag: sect.rank.inner.shaolin
        - type: complete_quest
          quest: sect_inner_shaolin
        - type: message
          speaker: "扫碑老人"
          text: "制敌而不伤人，才算懂了少林棍法。从今日起你晋升罗汉堂内传俗家弟子，这门《少林金刚护体》一并传你。待伏魔棍修至二十六级，便可接罗汉出师印证。"

- id: sect_grad_shaolin
  name: "出师·罗汉印证"
  objectives:
    - stage: trial_fight
      text: "前往白马寺外山门，与罗汉堂执事僧慧石印证棍法。"
    - stage: report_master
      text: "回古碑亭向扫碑老人澄尘辞行出师。"
    - stage: completed
      text: "你已通过罗汉堂印证体面出师，保留全部少林武学并可自由另拜高师。"
  reward:
    money: 120
    combat_exp: 120
    potential: 90
    items: []
  events:
    - id: shaolin_grad_start
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: flag
          flag: sect.active.shaolin
        - type: flag
          flag: sect.rank.inner.shaolin
        - type: art_level_at_least
          art: luohan_subduing_staff
          level: 26
        - type: quest_not_started
          quest: sect_grad_shaolin
      actions:
        - type: set_stage
          quest: sect_grad_shaolin
          stage: trial_fight
        - type: show_npc
          npc: shaolin_trial_monk
        - type: message
          speaker: "扫碑老人"
          text: "徒儿，你的伏魔棍已臻二十六级，老朽能教你的都教得差不多了。少室山来的执事僧慧石正在外山门候你，胜过他便算体面出师。"

    - id: shaolin_grad_fight
      trigger:
        type: talk
        npc: shaolin_trial_monk
      conditions:
        - type: quest_stage
          quest: sect_grad_shaolin
          stage: trial_fight
      actions:
        - type: message
          speaker: "罗汉堂执事僧慧石"
          text: "阿弥陀佛，请师弟出棍印证！"
        - type: start_battle
          target: shaolin_trial_monk

    - id: shaolin_grad_defeat
      trigger:
        type: kill
        npc: shaolin_trial_monk
      conditions:
        - type: quest_stage
          quest: sect_grad_shaolin
          stage: trial_fight
      actions:
        - type: hide_npc
          npc: shaolin_trial_monk
        - type: set_stage
          quest: sect_grad_shaolin
          stage: report_master
        - type: message
          speaker: "旁白"
          text: "慧石收棍合十，赞你棍势沉浑有度。你可以回古碑亭向澄尘师父辞行出师了。"

    - id: shaolin_grad_complete
      trigger:
        type: talk
        npc: baima_stone_sweeper
      conditions:
        - type: quest_stage
          quest: sect_grad_shaolin
          stage: report_master
      actions:
        - type: clear_flag
          flag: sect.active.shaolin
        - type: clear_flag
          flag: sect.has_active
        - type: set_flag
          flag: sect.graduated.shaolin
        - type: complete_quest
          quest: sect_grad_shaolin
        - type: message
          speaker: "扫碑老人"
          text: "善哉。今日你已体面出师，所学棍法与禅功尽数留身，往后即便另拜他门高师亦无妨。白马寺的钟声随时迎你回来听。"

- id: sect_job_shaolin_scripture
  name: "门派差事·白马护经"
  objectives:
    - stage: patrol_road
      text: "沿白马寺官道巡看香客，再回白马寺古碑亭清扫落叶。"
    - stage: report_monk
      text: "回白马寺外山门向知客僧明心复命。"
  reward:
    money: 45
    combat_exp: 75
    potential: 55
    items: []
  events:
    - id: sect_job_shaolin_start
      trigger:
        type: talk
        npc: baima_guest_monk
      conditions:
        - type: flag
          flag: sect.active.shaolin
        - type: quest_not_started
          quest: sect_job_shaolin_scripture
      actions:
        - type: set_stage
          quest: sect_job_shaolin_scripture
          stage: patrol_road
        - type: message
          speaker: "知客僧明心"
          text: "师弟得空？劳烦沿白马寺官道巡看一圈香客，再顺道去古碑亭替澄尘师叔扫扫石阶落叶，回来记一份门内功课。"

    - id: sect_job_shaolin_sweep
      trigger:
        type: enter_room
        map: luoyang_city
        position: [-1, 7]
      conditions:
        - type: quest_stage
          quest: sect_job_shaolin_scripture
          stage: patrol_road
      actions:
        - type: set_stage
          quest: sect_job_shaolin_scripture
          stage: report_monk
        - type: message
          speaker: "旁白"
          text: "官道清静，古碑亭的枯叶也已扫作一堆，你挥帚间暗合棍法步点，颇有心得。"

    - id: sect_job_shaolin_finish
      trigger:
        type: talk
        npc: baima_guest_monk
      conditions:
        - type: quest_stage
          quest: sect_job_shaolin_scripture
          stage: report_monk
      actions:
        - type: message
          speaker: "知客僧明心"
          text: "辛苦师弟，这份香火盘缠与门内功课请收下。"
        - type: complete_job
          quest: sect_job_shaolin_scripture

# ============================================================================
# 2. 武当清修（开封武庙前街·清虚道长）
# ============================================================================

- id: sect_join_wudang
  name: "机缘·武庙扶道"
  objectives:
    - stage: fend_ruffian
      text: "在武庙前街击退欺负清虚道长的武庙泼皮头子。"
    - stage: meditate_verse
      text: "带着碗底调息口诀，去南门演武场或樊楼客舍静思片刻，再回武庙前街见清虚道长。"
    - stage: return_taoist
      text: "回武庙前街向清虚道长印证口诀。"
    - stage: completed
      text: "你已拜入武当外门清修一脉，获赠青竹道牌并习得《纯阳吐纳功》。"
  reward:
    money: 0
    combat_exp: 60
    potential: 45
    items: []
  events:
    - id: wudang_join_start
      trigger:
        type: talk
        npc: wudang_wandering_taoist
      conditions:
        - type: quest_completed
          quest: first_steps_kaifeng
        - type: art_level_at_least
          art: basic_internal
          level: 10
        - type: not_flag
          flag: sect.has_active
        - type: not_flag
          flag: sect.betrayed.any
        - type: not_flag
          flag: sect.betrayed.wudang
        - type: not_flag
          flag: sect.graduated.wudang
        - type: quest_not_started
          quest: sect_join_wudang
      actions:
        - type: set_stage
          quest: sect_join_wudang
          stage: fend_ruffian
        - type: show_npc
          npc: shrine_street_ruffian
        - type: message
          speaker: "旁白"
          text: "话音刚落，一个敞胸泼皮晃过来伸手推搡清虚道长。老道脚下轻滑，竟借力让泼皮扑了个空。"
        - type: message
          speaker: "清虚道长"
          text: "这位小友内息颇静，不如替贫道把这位施主请出武庙前街？记住，莫伤人筋骨。"

    - id: wudang_join_fight
      trigger:
        type: talk
        npc: shrine_street_ruffian
      conditions:
        - type: quest_stage
          quest: sect_join_wudang
          stage: fend_ruffian
      actions:
        - type: message
          speaker: "武庙泼皮头子"
          text: "臭小子敢替老道出头？先吃爷爷一拳！"
        - type: start_battle
          target: shrine_street_ruffian

    - id: wudang_join_defeat
      trigger:
        type: kill
        npc: shrine_street_ruffian
      conditions:
        - type: quest_stage
          quest: sect_join_wudang
          stage: fend_ruffian
      actions:
        - type: hide_npc
          npc: shrine_street_ruffian
        - type: set_stage
          quest: sect_join_wudang
          stage: meditate_verse
        - type: message
          speaker: "清虚道长"
          text: "善。老道在茶碗底给你留了半句纯阳吐纳口诀，你且去樊楼客舍或南门演武场静心体悟一番，再来武庙前街找我。"

    - id: wudang_join_insight_inn
      trigger:
        type: enter_room
        map: kaifeng_city
        position: [-1, 1]
      conditions:
        - type: quest_stage
          quest: sect_join_wudang
          stage: meditate_verse
      actions:
        - type: set_stage
          quest: sect_join_wudang
          stage: return_taoist
        - type: message
          speaker: "旁白"
          text: "你在客舍静坐片刻，默念碗底口诀，只觉丹田气息如暖泉流转，顿时明悟了几分“以静制动”的妙处。"

    - id: wudang_join_insight_yard
      trigger:
        type: enter_room
        map: kaifeng_city
        position: [-1, -1]
      conditions:
        - type: quest_stage
          quest: sect_join_wudang
          stage: meditate_verse
      actions:
        - type: set_stage
          quest: sect_join_wudang
          stage: return_taoist
        - type: message
          speaker: "旁白"
          text: "你在演武场边静立吐纳，照着老道留下的口诀缓吐浊气，呼吸绵长竟丝毫不乱。"

    - id: wudang_join_complete
      trigger:
        type: talk
        npc: wudang_wandering_taoist
      conditions:
        - type: quest_stage
          quest: sect_join_wudang
          stage: return_taoist
      actions:
        - type: set_flag
          flag: sect.active.wudang
        - type: set_flag
          flag: sect.has_active
        - type: give_item
          item: wudang_jade_talisman
          amount: 1
        - type: complete_quest
          quest: sect_join_wudang
        - type: message
          speaker: "清虚道长"
          text: "哈哈，孺子可教！贫道乃武当山清虚，下山采药偶遇小友，正是道缘。这枚青竹道牌收好，今日便收你为武当外门清修弟子，先传你《纯阳吐纳功》。待修至十四级，再来领紫霄入室考校。"

- id: sect_inner_wudang
  name: "师门·假道惑众"
  objectives:
    - stage: confront_fake
      text: "前往西市老井拆穿假冒武当兜售金丹的骗局，并制住其护院。"
    - stage: return_pills
      text: "将收缴的伪造金丹木匣带回武庙前街交给清虚道长。"
    - stage: completed
      text: "你已清查假道，获清虚授武当紫霄外传道箓，晋升入室弟子并习得《武当太极剑》。"
  reward:
    money: 50
    combat_exp: 85
    potential: 65
    items:
      - id: clear_spirit_san
        amount: 2
  events:
    - id: wudang_inner_start
      trigger:
        type: talk
        npc: wudang_wandering_taoist
      conditions:
        - type: flag
          flag: sect.active.wudang
        - type: art_level_at_least
          art: chunyang_breath
          level: 14
        - type: quest_not_started
          quest: sect_inner_wudang
      actions:
        - type: set_stage
          quest: sect_inner_wudang
          stage: confront_fake
        - type: show_npc
          npc: fake_taoist_guard
        - type: message
          speaker: "清虚道长"
          text: "近来西市老井一带有人假托武当名号卖劣质金丹害人。你纯阳功已至十四级，去把那木匣假丹收回来，莫让江湖人笑话武当。"

    - id: wudang_inner_fight
      trigger:
        type: talk
        npc: fake_taoist_guard
      conditions:
        - type: quest_stage
          quest: sect_inner_wudang
          stage: confront_fake
      actions:
        - type: message
          speaker: "假道护院"
          text: "真武当找上门了？休想砸了老子的财路！"
        - type: start_battle
          target: fake_taoist_guard

    - id: wudang_inner_defeat
      trigger:
        type: kill
        npc: fake_taoist_guard
      conditions:
        - type: quest_stage
          quest: sect_inner_wudang
          stage: confront_fake
      actions:
        - type: hide_npc
          npc: fake_taoist_guard
        - type: give_item
          item: fake_taoist_pills
          amount: 1
        - type: set_stage
          quest: sect_inner_wudang
          stage: return_pills
        - type: message
          speaker: "旁白"
          text: "护院被你震退，假道士见势不妙丢下伪造金丹木匣溜之大吉。"

    - id: wudang_inner_complete
      trigger:
        type: talk
        npc: wudang_wandering_taoist
      conditions:
        - type: quest_stage
          quest: sect_inner_wudang
          stage: return_pills
        - type: has_item
          item: fake_taoist_pills
      actions:
        - type: take_item
          item: fake_taoist_pills
          amount: 1
        - type: set_flag
          flag: sect.rank.inner.wudang
        - type: complete_quest
          quest: sect_inner_wudang
        - type: message
          speaker: "清虚道长"
          text: "好徒儿，处事清净利落。今日正式授你武当紫霄外传道箓，将《武当太极剑》亲传于你。待太极剑修至二十六级，再来与为师拆招出师。"

- id: sect_grad_wudang
  name: "出师·太极拆招"
  objectives:
    - stage: spar_master
