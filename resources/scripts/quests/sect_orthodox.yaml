        - type: complete_quest
          quest: sect_grad_taihu
        - type: message
          speaker: "太湖白发医者"
          text: "医者仁心，剑者守正。今日你已体面出师，所学水榭真传尽归己身，日后无论入何门墙，记得先救人、后论剑。"

