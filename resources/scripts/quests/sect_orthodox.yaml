          npc: taihu_plague_raider
        - type: set_stage
          quest: sect_grad_taihu
          stage: report_senior
        - type: message
          speaker: "旁白"
          text: "你以柔韧剑势逼退毒掌，将毒坛尽数沉入泥底，太湖沿岸转危为安。"

