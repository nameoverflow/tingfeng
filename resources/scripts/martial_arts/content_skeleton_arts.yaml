          - id: iron_body_buff
            duration: 12.0
            value: 3
        target: []
    - id: dali_mountain_push
      name: "苍山排云"
      desc: "双掌齐推，劲力如山石滚落，将对手硬生生逼退。"
      msg: "吐气开声，双掌如推山石般压向对手"
      unlock_level: 14
