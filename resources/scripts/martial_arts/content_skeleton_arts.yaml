- id: luoyang_sword
  name: "洛阳剑法"
  type: sword
  tier: regional
  desc: "相传是旧都天津桥上一位不肯报名的剑客所遗，后经牡丹会世代剑客增补，讲究步法、出剑角度和截断来势。洛阳剑客以此剑示名：出剑之前，先报姓名。"
  foundation: basic_sword
  requires:
    - art: basic_sword
      level: 10
  max_level: 40
  attack_moves:
    - id: luoyang_bridge_cut
      name: "天津桥斜斩"
      desc: "借桥头宽阔地势，斜斩对手外门。"
      msg: "踏上半步，斜斩外门"
      unlock_level: 1
      damage: 13
      animation:
        action: rig.sword.chop_a
        tags: ["sword", "slash"]
    - id: luoyang_wine_thread_stab
      name: "洛水直刺"
      desc: "剑尖顺酒盏边缘递出，轻而直。"
      msg: "剑尖平直刺向中路"
      unlock_level: 4
      damage: 16
      animation:
        action: rig.sword.thrust_a
        tags: ["sword", "stab"]
    - id: luoyang_peony_lift
      name: "牡丹挑灯"
      desc: "手腕微翻，剑锋自下而上挑向对方持兵手腕。"
      msg: "剑尖自下轻挑，直取手腕"
      unlock_level: 12
      damage: 20
      animation:
        action: rig.sword.rising_cut_a
        tags: ["sword", "uppercut"]
  active_skills:
    - id: luoyang_intercept_cut
      name: "截脉剑"
      desc: "看准对手发力，半路截住手臂。"
      msg: "看准来势，剑锋截入手臂"
      unlock_level: 3
      cd: 8.0
      target: Single
      cost: 35
      ap_req: 65
      req_status: []
      damage: 48
      animation:
        action: rig.sword.chop_a
        tags: ["sword", "slash", "counter"]
      effect:
        self: []
        target:
          - id: weakened
            duration: 8.0
            value: 1
    - id: luoyang_river_moon
      name: "洛水横月"
      desc: "踏步拧腰，一剑挥出半轮寒光，迫开贴身之敌。"
      msg: "横剑一振，剑气如洛水夜月般掠出"
      unlock_level: 15
      cd: 14.0
      target: Single
      cost: 55
      ap_req: 75
      req_status: []
      damage: 78
      animation:
        action: rig.sword.qi_wave_a
        tags: ["sword", "qi", "ranged"]
      effect:
        self: []
        target: []
    - id: luoyang_name_net
      name: "天津剑网"
      desc: "旧都名剑客压阵绝技，步随剑走，三剑织成严密剑幕。"
      msg: "连换三步，剑光在桥头织作一片寒网"
      unlock_level: 25
      cd: 20.0
      target: Single
      cost: 85
      ap_req: 95
      req_status: []
      damage: 118
      animation:
        action: rig.sword.sword_net_a
        tags: ["sword", "combo", "net"]
      effect:
        self: []
        target:
          - id: bleeding
            duration: 8.0
            value: 4

- id: dali_guard_fist
  name: "茶马护身拳"
  type: fist
  tier: regional
  desc: "段氏旧府护院为茶马商队编的拳法。拳架低，步子沉，适合护送和近身防守。段家失了王位，以护送商路为生，这套拳便成了段家对外示人的功夫；真正的家传，从不在人前露。"
  foundation: basic_fist
  requires:
    - art: basic_fist
      level: 10
  max_level: 40
  attack_moves:
    - id: dali_door_push
      name: "推门势"
      desc: "肩肘同时前压，逼开近身的对手。"
      msg: "沉肩推肘，拳势如推重门"
      unlock_level: 1
      damage: 12
      animation:
        action: rig.fist.punch_a
        tags: ["fist", "strike"]
    - id: dali_iron_elbow
      name: "铁肘"
      desc: "拳未必到，肘先撞进来。"
      msg: "近身撞出一记铁肘"
      unlock_level: 5
      damage: 18
      animation:
        action: rig.fist.heavy_a
        tags: ["fist", "heavy", "strike"]
    - id: dali_mule_kick
      name: "踏山脚"
      desc: "走山路练出的沉重脚力，一脚直踹对手迎门骨。"
      msg: "提膝沉胯，一脚重重踹向对手下盘"
      unlock_level: 12
      damage: 21
      animation:
        action: rig.fist.kick_a
        tags: ["fist", "kick"]
  active_skills:
    - id: dali_cover_body
      name: "落桩劲"
      desc: "两脚落桩，沉气护住要害，减轻接下来的伤势。"
      msg: "两脚落桩，沉气守住要害"
      unlock_level: 2
      cd: 14.0
