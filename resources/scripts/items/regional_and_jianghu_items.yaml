- id: forged_iron_bracers
  name: "新打护腕铁片"
  desc: "东巷铁铺赵铁匠刚淬过火的护腕铁片，边角打磨得齐整，还带着一点煤火余温。"

- id: pawned_old_mortar
  name: "当铺旧药碾"
  desc: "仁和药铺早年质在西市当铺的一只沉铜药碾，碾槽里还留着陈年三七与冰片的药味。"

- id: smuggled_seal_box
  name: "封泥木匣"
  desc: "从北郊芦苇浅滩搜出的扁木匣，表面印着半真半假的官仓封泥，里头压着几张私改过数目的盐引。"

- id: luoyang_fake_manual
  name: "伪造古剑谱"
  desc: "旧剑市流出的所谓“完整本天津桥剑谱”，纸张虽用茶水做旧，第三页换气转腕的注脚却被人故意写反了一行。"

- id: luoyang_stele_rubbing
  name: "古碑拓片"
  desc: "从白马寺钟亭旧碑拓下的宣纸，墨迹黑白分明，记着昔年洛阳剑客论剑时的三句步法总纲。"

- id: dali_teahorse_contract
  name: "染泥茶马契"
  desc: "苍山马帮遗失的茶马总契，油布封皮沾着洗马涧的红泥。内页除了茶包马匹，某行“铁匣”字样旁被人用指甲重重掐了一道印子。"

- id: duan_temple_letter
  name: "段氏手书"
  desc: "段氏护院总管亲笔写就的短笺，封口盖着旧府私印。凭此手书可入崇圣寺三塔院。"

- id: taihu_split_prescription
  name: "分方药帖"
  desc: "守阁女医沈青笺一分为二的药帖，隐去了水榭秘传的君药分量，却刚好能治水寨伤者所中的寒湿刀伤。"

- id: burned_tally_half
  name: "半截焦木牌"
  desc: "北郊废军祠灰堆边拾到的半截木牌，断口被火燎黑，背面用剑尖刻着“渡河勿念”四字，笔锋与威远内院井台上的刻字如出一辙。"

- id: yamen_bounty_manual
  name: "捕房锁拿手札"
  desc: "开封府捕房老捕快传下的锁拿手札，记着街头巷尾近身扣腕、卸力的实用招数。"
  use:
    type: learn_art
    art: yamen_grappling_hand
    level: 1
    min_level: 1
    max_level: 15
    quality: 2
    consume: false
    message: "你翻阅《捕房锁拿手札》，学会了开封府捕房的近身拿人手法。"
    repeat_message: "你对照《捕房锁拿手札》揣摩分筋扣腕的部位，手法愈发熟练。"

- id: caoban_water_manual
  name: "汴水踏浪谱"
  desc: "汴河漕帮老船头手绘的步法图谱，画着在摇晃跳板与急流船头站稳换步的诀窍。"
  use:
    type: learn_art
    art: bianshui_wave_step
    level: 1
    min_level: 1
    max_level: 15
    quality: 2
    consume: false
    message: "你照着《汴水踏浪谱》试走几步，悟出了漕帮船头借浪稳身的步法。"
    repeat_message: "你又细看了一遍《汴水踏浪谱》，对晃板换步的节奏更有体会。"

- id: luoyang_sword_notes
  name: "天津桥剑意残篇"
  desc: "闻声先生对照白马寺古碑拓片补定的洛阳剑法要诀，补上了坊间伪本故意隐去的换步与截脉真意。"
  use:
    type: learn_art
    art: luoyang_sword
    level: 1
    min_level: 1
    max_level: 20
    quality: 3
    consume: false
    message: "你细读《天津桥剑意残篇》，领悟了洛阳剑法步随剑走、截断来势的真意。"
    repeat_message: "你重读《天津桥剑意残篇》，对天津桥剑路的换位与收剑更明了一分。"

- id: dali_cliff_palm_manual
  name: "苍山裂石掌谱"
  desc: "大理段氏内院护卫演练重掌的图谱，记着如何将呼吸沉入脚跟、以双掌开碑裂石。"
  use:
    type: learn_art
    art: cangshan_cleaving_palm
    level: 1
    min_level: 1
    max_level: 18
    quality: 3
    consume: false
    message: "你按《苍山裂石掌谱》沉腰运劲，学会了苍山裂石掌的起手与发力。"
    repeat_message: "你反复揣摩《苍山裂石掌谱》，双掌吐劲比先前更凝实了。"

- id: taihu_mist_step_manual
  name: "烟水步图解"
  desc: "太湖水榭收藏的轻功图册，详注了水岸湿石与芦苇舟楫间的轻身落脚之法。"
  use:
    type: learn_art
    art: mist_step
    level: 1
    min_level: 1
    max_level: 18
    quality: 3
    consume: false
    message: "你参详《烟水步图解》，掌握了足尖借水气滑步、敛去声息的法门。"
    repeat_message: "你又读了一遍《烟水步图解》，脚下轻缓换气愈发自然。"

- id: willow_sword_manual
  name: "拂柳剑谱"
  desc: "太湖水榭方书阁珍藏的剑谱，以花笺小楷写成，讲的是顺势卸力、如垂柳拂水般的剑路。"
  use:
    type: learn_art
    art: taihu_willow_sword
    level: 1
    min_level: 1
    max_level: 18
    quality: 3
    consume: false
    message: "你展开花笺写就的《拂柳剑谱》，学会了太湖柔韧顺势的拂柳剑法。"
    repeat_message: "你温习《拂柳剑谱》，对听风辨位、借力回剑的火候更清楚了。"

- id: wound_powder
  name: "金创药"
  desc: "仁和药铺与太湖药房常备的外敷止血散，以三七、白及与血竭研成细末，敷上伤口便能收敛血口、缓解伤势。"
  use:
    type: medicine
    hp: 45
    cure_injury: 60
    consume: true
    message: "你拆开药包敷上金创药，伤处清凉收敛，气血与外伤都平复了不少。"

- id: returning_qi_pill
  name: "回气丸"
  desc: "以黄芪、党参与陈皮蜜炼而成的乌黑药丸，行路或演武力竭时含服一丸，丹田便有温热真气徐徐回升。"
  use:
    type: medicine
    qi: 55
    consume: true
    message: "你服下一粒回气丸，一股温润药力化入丹田，耗损的内息渐渐回转。"

- id: clear_spirit_san
  name: "清心散"
  desc: "带着薄荷与冰片清香的细散，能澄澈心神、退去苦读或久战后的昏沉。"
  use:
    type: medicine
    jing: 45
    cure_injury: 45
    consume: true
    message: "你嗅入少许清心散又以温水送服，眉心一凉，倦意顿时消减。"

- id: taihu_mending_pill
  name: "太湖续脉丹"
  desc: "太湖水榭以湖畔灵药精炼而成的疗伤重药，蜡封严密，专为重伤气弱之人续护经脉。"
  use:
    type: medicine
    hp: 80
    qi: 40
    cure_injury: 300
    consume: true
    message: "你捏碎蜡丸服下太湖续脉丹，药力循经脉化开，胸口郁结的重伤顿时消散。"

- id: qinggang_sword
  name: "青钢剑"
  desc: "开封与洛阳铁铺常见的标准三尺长剑，剑脊厚实、刃口轻快，最合江湖人历练防身。"
  use:
    type: equip
    slot: weapon
    weapon_kind: sword
    damage_bonus: 5
    hit: 8
    agility: 1
    message: "你握住青钢剑剑柄，挽了个剑花，将长剑佩在腰间。"

- id: luoyang_white_blade
  name: "洛阳白刃剑"
  desc: "洛阳旧剑市名匠精锻的窄刃长剑，剑身映光如秋水，出剑回剑皆比寻常铁剑快上一分。"
  use:
    type: equip
    slot: weapon
    weapon_kind: sword
    damage_bonus: 8
    hit: 12
    parry: 6
    agility: 2
    message: "你拔出洛阳白刃剑试了试锋芒，剑身轻鸣，十分趁手。"

- id: iron_fist_bracers
  name: "精铁护腕"
  desc: "衬着厚牛皮的精铁护腕，扣在双腕上既能架挡兵刃，出拳撞肘时又添三分沉猛。"
  use:
    type: equip
    slot: weapon
    weapon_kind: fist
    damage_bonus: 5
    hit: 6
    parry: 8
    strength: 2
    message: "你将一对精铁护腕牢牢扣在双腕上，试着握拳沉肘，分量正好。"

- id: cangshan_rock_gauntlets
  name: "苍山裂石护手"
  desc: "大理段氏护院演练重掌时佩戴的乌钢护手，掌指关节处嵌着细密铁纹，发力如山石压顶。"
  use:
    type: equip
    slot: weapon
    weapon_kind: fist
    damage_bonus: 8
    parry: 10
    strength: 3
    vitality: 1
    message: "你戴上苍山裂石护手，双掌一合，沉甸甸的乌钢护手与掌力浑然一体。"

- id: patrol_leather_armor
  name: "巡检皮甲"
  desc: "捕房与商队护卫常穿的熟牛皮短甲，内衬棉布，虽不华丽，却能稳稳卸去刀剑劈砍的劲力。"
  use:
    type: equip
    slot: armor
    damage_reduction: 4
    max_hp: 25
    parry: 4
    message: "你穿好巡检皮甲，收紧腰扣，护住前胸后背要害。"

- id: taihu_cloud_robe
  name: "水榭云纹衫"
  desc: "太湖水榭用湖绸夹织韧麻缝制的轻便外衫，衣摆随风轻扬，不碍步法腾挪，更能敛气护身。"
  use:
    type: equip
    slot: armor
    damage_reduction: 3
    max_hp: 15
    max_qi: 25
    dodge: 10
    agility: 2
    message: "你披上水榭云纹衫，衣衫轻软贴身，举手投足倍感轻灵。"
